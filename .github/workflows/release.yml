name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # APPLE_CERTIFICATE (base64 .p12) and APPLE_SIGNING_IDENTITY sign the app with the
      # Developer ID certificate; APPLE_ID, APPLE_PASSWORD (app-specific) and APPLE_TEAM_ID
      # notarize and staple it: https://v2.tauri.app/distribute/sign/macos/
      # TAURI_SIGNING_PRIVATE_KEY signs the updater artifacts (.app.tar.gz + .sig) and the
      # action uploads latest.json, which the in-app updater reads. Generated with
      # `npx tauri signer generate --ci`; the matching public key is plugins.updater.pubkey.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notes & Goals ${{ github.ref_name }}"
          releaseBody: |
            Open the `.dmg` and drag **Notes & Goals** into Applications. Universal build for macOS 12 or later, signed with a Developer ID and notarized by Apple.

            Full install guide: https://ashishjain608.github.io/notes-goals-app/#install
          releaseDraft: false
          # Tags like v0.2.0-rc.1 publish as prereleases, which never become "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target universal-apple-darwin

      # A stable-named copy of the dmg, so releases/latest/download/Notes-Goals-macOS.dmg
      # (the website's and README's Download links) always resolves to the newest build.
      - name: Upload Notes-Goals-macOS.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n 1)
          cp -f "$dmg" Notes-Goals-macOS.dmg
          gh release upload "${{ github.ref_name }}" Notes-Goals-macOS.dmg --clobber
