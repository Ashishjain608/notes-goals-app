name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds are ad-hoc signed (bundle.macOS.signingIdentity "-" in tauri.conf.json) but
      # not notarized. Developer ID signing needs the APPLE_* secrets passed as env here and
      # that signingIdentity removed: https://v2.tauri.app/distribute/sign/macos/
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notes & Goals ${{ github.ref_name }}"
          releaseBody: |
            Open the `.dmg` and drag **Notes & Goals** into Applications. Universal build for macOS 12 or later.

            This build isn't notarized by Apple, so the first launch needs one extra step:
            1. Double-click the app. macOS says it can't verify it — click **Done**.
            2. Open **System Settings → Privacy & Security**, click **Open Anyway**, and confirm with your password.

            Or, in Terminal: `xattr -dr com.apple.quarantine "/Applications/Notes & Goals.app"`

            Full install guide: https://ashishjain608.github.io/notes-goals-app/#install
          releaseDraft: false
          # Tags like v0.2.0-rc.1 publish as prereleases, which never become "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target universal-apple-darwin

      # A stable-named copy of the dmg, so releases/latest/download/Notes-Goals-macOS.dmg
      # (the website's and README's Download links) always resolves to the newest build.
      - name: Upload Notes-Goals-macOS.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n 1)
          cp -f "$dmg" Notes-Goals-macOS.dmg
          gh release upload "${{ github.ref_name }}" Notes-Goals-macOS.dmg --clobber
