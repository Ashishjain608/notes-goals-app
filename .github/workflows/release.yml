name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Apple signing/notarization is optional: tauri-action signs and notarises the
      # build when these secrets are set, and produces an unsigned build (users then
      # need the Gatekeeper workaround in the README) when they're left empty.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Notes & Goals ${{ github.ref_name }}"
          releaseBody: |
            See https://ashishjain608.github.io/notes-goals-app/ for details.

            This build is unsigned unless noted otherwise below. On first launch, either
            right-click the app and choose Open, or run:
            `xattr -dr com.apple.quarantine "/Applications/Notes & Goals.app"`
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
